# Weekly collection of the Cyprus law digest skeleton, run by GitHub Actions.
#
# Why: Claude's sandbox may have no egress to the Cyprus sites, but it can reach
# GitHub even under the "package managers only" network policy. So the collector
# runs here, commits its output to the repo, and the skill reads it from GitHub
# (scripts/fetch_run.py) instead of fetching the sites itself.
#
# Setup: copy the whole skill folder into a repo (SKILL.md, scripts/, references/,
# tests/), put this file at .github/workflows/digest.yml, enable Actions, and
# allow the workflow to write (Settings → Actions → General → Workflow permissions
# → "Read and write"). Runs every Monday 03:30 UTC (06:30 Cyprus) for the
# previous Monday–Sunday week; can be started by hand with a custom window.

name: cyprus-law-digest

on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      window:
        description: "previous | current | days:N | YYYY-MM-DD..YYYY-MM-DD"
        default: "previous"
        required: false

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: System and Python dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q poppler-utils fonts-dejavu-core
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet requests beautifulsoup4 lxml pypdf reportlab cryptography certifi

      - name: Offline self-test (parsers + fixtures)
        run: python scripts/selftest.py

      # mof.gov.cy sends its certificate without the intermediate CA; complete the chain the way a
      # browser does (AIA) and keep verification on. Only if that fails, verification is switched
      # off for that single host, with a warning in the run summary.
      - name: Complete the Gazette certificate chain
        id: chain
        run: |
          if BUNDLE=$(python scripts/fix_chain.py www.mof.gov.cy --out "$RUNNER_TEMP/ca-bundle.pem"); then
            echo "REQUESTS_CA_BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
            echo "chain completed via AIA: $BUNDLE"
          else
            echo "EXTRA_ARGS=--insecure-hosts www.mof.gov.cy" >> "$GITHUB_ENV"
            echo "::warning::could not complete the mof.gov.cy certificate chain – TLS verification disabled for that host only"
          fi

      - name: Collect
        id: collect
        env:
          WINDOW: ${{ github.event.inputs.window || 'previous' }}
        run: |
          set -e
          case "$WINDOW" in
            previous) ARGS="--week previous" ;;
            current)  ARGS="--week current" ;;
            days:*)   ARGS="--days ${WINDOW#days:}" ;;
            *..*)     ARGS="--from ${WINDOW%..*} --to ${WINDOW#*..}" ;;
            *)        echo "bad window: $WINDOW"; exit 1 ;;
          esac
          python scripts/digest_collect.py $ARGS $EXTRA_ARGS --out runs -v 2>&1 | tee collect.log
          RUN_DIR=$(ls -d runs/*_* | sort | tail -1)
          echo "run_dir=$RUN_DIR" >> "$GITHUB_OUTPUT"
          echo "run_name=$(basename "$RUN_DIR")" >> "$GITHUB_OUTPUT"
          # the raw HTTP cache is large and reproducible – not committed
          rm -rf "$RUN_DIR/raw"
          rm -rf runs/latest && cp -r "$RUN_DIR" runs/latest
          cp collect.log runs/latest/collect.log
          python - <<'EOF'
          import json, pathlib
          st = json.loads(pathlib.Path("runs/latest/status.json").read_text(encoding="utf-8"))
          bad = {k: v for k, v in st["sources"].items() if v.get("reason") or v.get("error")}
          print("sources:", {k: v.get("items") for k, v in st["sources"].items()})
          if bad:
              print("::warning::blocked or failed sources: " + json.dumps(bad, ensure_ascii=False))
          EOF

      - name: Live smoke test (structure of the live pages)
        run: python scripts/selftest.py --live-only || echo "::warning::live smoke test reported problems – see log"

      - name: Commit results
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add runs
          git commit -m "digest run ${{ steps.collect.outputs.run_name }} [skip ci]" || echo "nothing to commit"
          git push

      - name: Upload run as artifact (backup, 90 days)
        uses: actions/upload-artifact@v5
        with:
          name: digest-${{ steps.collect.outputs.run_name }}
          path: runs/latest
          retention-days: 90
